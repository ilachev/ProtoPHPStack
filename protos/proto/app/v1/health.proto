syntax = "proto3";

package app.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option php_namespace = "App\\Api\\V1";
option php_metadata_namespace = "App\\Api\\V1\\Metadata";
option go_package = "app/api/v1";

// HealthService exposes neutral runtime health endpoints for the template core.
service HealthService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    description: "Core runtime health endpoints"
  };

  // Check returns the current liveness state of the runtime.
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get: "/api/v1/health"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Health check"
      description: "Returns a minimal liveness response for the core runtime"
      tags: "system"
      responses: {
        key: "200"
        value: {
          description: "Runtime is healthy"
        }
      }
    };
  }
}

// HealthCheckRequest is intentionally empty.
message HealthCheckRequest {}

// HealthCheckResponse describes the current runtime state.
message HealthCheckResponse {
  string status = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Current health status"
    example: "\"ok\""
  }];
  int64 timestamp = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Unix timestamp when the response was created"
    example: "\"1710000000\""
  }];
}
